<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juros Compostos</title>
    <link rel="stylesheet" href="pratica03exercicio06.css">
</head>
<body>
    <main class="container">
        <h1>Juros Compostos</h1>
        <form id="form-juros">
            <label for="capital">Capital Inicial (C):</label>
            <input type="number" id="capital" step="any" min="0" required placeholder="Ex: 1000">

            <label for="taxa">Taxa de Juros (%) (i):</label>
            <input type="number" id="taxa" step="any" min="0" required placeholder="Ex: 5">

            <label for="tempo">Prazo/Tempo (t):</label>
            <input type="number" id="tempo" step="any" min="0" required placeholder="Ex: 12">

            <button type="submit">Calcular</button>
        </form>
        <div id="resultado" class="resultado"></div>
    </main>
    <script src="pratica03exercicio06.js"></script>
</body>
</html>
